# Model and reasoning inherit from the client/account selection.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[shell_environment_policy]
ignore_default_excludes = false

[projects."/home/rbl/.dotfiles"]
trust_level = "trusted"

[projects."/home/rbl/ansible_arch"]
trust_level = "trusted"
